name: keepalive

# Render's free plan puts the backend to sleep after 15 minutes without requests, and the next
# request then waits 30–50 s. Ping /health so testers and judges get a warm backend (phase 10.7).
# GitHub may delay scheduled runs by a few minutes; every 10 minutes keeps it inside the 15-minute window.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://goldito-backend.onrender.com/health
