name: publish-backend

# Builds the backend image and pushes it to GitHub Container Registry, where the
# Nebius Serverless AI endpoint pulls it (U0 / phase 10.3). The image holds no
# secrets — the endpoint injects env at runtime — so the package can be public.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/minsikpaul92/goldito-backend:latest
            ghcr.io/minsikpaul92/goldito-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
