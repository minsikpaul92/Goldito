<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Goldito</title>
    <meta name="theme-color" content="#FFF6E3" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="focus-ring">
      /* One keyboard focus ring (DESIGN.md): 2 px primary, 2 px offset. The app sets --focus-ring from the theme. */
      :focus-visible {
        outline: 2px solid var(--focus-ring, #1b4332) !important;
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      /* Hints read as hints, never as typed answers. */
      input::placeholder,
      textarea::placeholder {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <noscript>Goldito needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
