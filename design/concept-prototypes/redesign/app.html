<style>
/* Tokens = frontend/theme/tokens.ts (+ shadcn-style elevation). */
:root{
  --background:#F7F7F5; --surface:#FFFFFF; --text:#1A1A1A; --text-muted:#5C5C5C; --primary:#2D6A4F; --primary-text:#FFFFFF;
  --accent:#D8F3DC; --border:#E5E5E0; --border-strong:#86867F; --track:#E5E5E0; --error-surface:#FEF3F2; --warning-surface:#FFFAEB; --success-surface:#ECFDF3; --error:#B42318; --success:#067647; --warning:#B54708;
  --xs:4px; --sm:8px; --md:16px; --lg:24px; --xl:32px; --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05); --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --page:var(--color-background); --page-text:var(--color-text); --page-muted:var(--color-text-muted);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-text);font-family:Inter,-apple-system,system-ui,sans-serif;padding-inline:16px;padding-block:40px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
header h1{margin:0 0 8px;font-size:30px;letter-spacing:-.02em}
header p{margin:0;color:var(--page-muted);max-width:760px;line-height:1.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--page-muted)}
.legend b{color:var(--page-text)}
section.pair{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:980px){section.pair{grid-template-columns:1fr}}
.col h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted);margin:0 0 10px}
.shot{width:100%;max-width:360px;border-radius:28px;border:6px solid #1A1A1A;display:block;background:#fff}
.notes h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.notes .tabname{color:var(--page-muted);font-size:13px;margin-bottom:12px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.notes li b{font-weight:600}
.notes .comp{margin-top:14px;font-size:12px;color:var(--page-muted)}
.notes .comp code{background:rgba(127,127,127,.15);border-radius:4px;padding:1px 5px;font-size:11.5px}

/* ---------- phone + app (design system) ---------- */
.phone{width:360px;max-width:100%;height:760px;border-radius:28px;border:6px solid #1A1A1A;background:var(--background);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px var(--md) 10px;background:var(--background)}
.bar h4{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.icons{display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--text)}
.ib svg{width:22px;height:22px}
.ib .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--error);box-shadow:0 0 0 2px var(--background)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px}
.scroll{flex:1;overflow:hidden;padding:4px var(--md) var(--md);display:flex;flex-direction:column;gap:var(--md)}
.scroll>*{flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.pad{padding:var(--md)}
.row{display:flex;align-items:center;gap:var(--sm)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--sm)}
.stack{display:flex;flex-direction:column;gap:var(--sm)}
.muted{color:var(--text-muted)} .small{font-size:12.5px} .tiny{font-size:11px}
.b{font-weight:600} .h{font-weight:700;font-size:16px;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.live{background:var(--accent);color:var(--primary)} .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.pill.line{border:1px solid var(--border);color:var(--text)}
.pill.warn{background:var(--warning-surface);color:var(--warning)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:var(--r-md);font-weight:600;font-size:15px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-text);box-shadow:var(--shadow-xs)}
.btn.sec{background:var(--surface);color:var(--primary);border-color:var(--border)}
.link{color:var(--primary);font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);min-height:36px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.chip.soft{background:var(--accent);border-color:transparent;color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.photo{background-size:cover;background-position:center;border-radius:var(--r-md)}
.avatar{width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border)}
.avatar.emoji{display:grid;place-items:center;background:var(--accent);font-size:22px}
.prog{display:flex;gap:4px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--track)}.prog i.on{background:var(--primary)}
.divider{height:1px;background:var(--border)}
.tabs{display:flex;justify-content:space-around;padding:6px 6px 16px;background:var(--surface);border-top:1px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text-muted);width:62px}
.tab .p{width:50px;height:28px;border-radius:14px;display:grid;place-items:center}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--primary)} .tab.on .p{background:var(--accent)}
.pinned{padding:var(--sm) var(--md) var(--sm);background:var(--background)}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:44px 14px 1fr;gap:8px;align-items:start;padding-bottom:12px}
.tl .t{font-size:11.5px;font-weight:600;color:var(--text-muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tl .rail{position:relative;height:100%}.tl .rail::before{content:"";position:absolute;left:6px;top:14px;bottom:-12px;width:2px;background:var(--border)}
.tl .rail::after{content:"";position:absolute;left:2px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl .it:last-child .rail::before{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid3 .g{aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;position:relative}
.grid3 .g span{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.92);border-radius:999px;font-size:10px;font-weight:600;padding:1px 6px}
.seg{display:flex;background:#EFEFEB;border-radius:10px;padding:3px}
.seg span{flex:1;text-align:center;padding:6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg span.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs)}
.steps{display:flex;gap:4px;align-items:center}
.steps i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--track);color:var(--text-muted)}
.steps i.d{background:var(--success);color:#fff}.steps i.c{background:var(--primary);color:#fff}
.steps b{flex:1;height:2px;background:var(--border)}.steps b.d{background:var(--success)}
.task{border:2px solid var(--primary)}
.bubble{background:var(--background);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.5}
.skinbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:13px}
.skinbar button{font:inherit;font-weight:600;border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-primary);border-radius:var(--radius-md);padding:0 14px;min-height:var(--size-touch-target);cursor:pointer}
.skinbar button[aria-pressed="true"]{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-text)}
.skinbar a{color:inherit;margin-left:6px}
footer{color:var(--page-muted);font-size:13px;line-height:1.6}

html,body{margin:0;padding:0;background:transparent}
body{padding:0!important}
.phone{width:402px!important;max-width:none;height:874px!important;border:0!important;border-radius:0!important}
</style>

    </div></template>
<div id="out"></div>
<script>
  addEventListener("hashchange", () => location.reload());
  const skin = new URLSearchParams(location.search).get("skin");
  if (skin) document.documentElement.dataset.skin = skin;
  const id = location.hash.slice(1) || "owner-home";
  const t = document.getElementById("s-" + id) || document.getElementById("s-owner-home");
  const out = document.getElementById("out"); out.appendChild(t.content.cloneNode(true));
  out.querySelectorAll(".phone").forEach((p) => {
    const bar = document.getElementById("bar").content.cloneNode(true);
    bar.querySelector("h4").textContent = p.dataset.title;
    if (p.dataset.ava) bar.querySelector(".ava").textContent = p.dataset.ava;
    p.prepend(bar);
    const tabs = document.getElementById("tabbar").content.cloneNode(true);
    tabs.querySelector(`[data-t="${p.dataset.tab}"]`).classList.add("on");
    p.append(tabs);
  });
  out.querySelectorAll(".pixel-room canvas").forEach((c) => {
    const img = new Image(); img.onload = () => { const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
      const s = Math.min(img.width, img.height); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 4, s, s, 0, 0, 24, 24); };
    img.src = c.dataset.src;
  });
</script>
