    <circle cx="48" cy="40" r="5" fill="#D8F3DC"/><circle cx="72" cy="48" r="4" fill="#D8F3DC"/>
    <path class="pn-o" fill="none" stroke="#E76F51" d="M80 102c10-4 14-14 10-22-3-6-12-6-14 0-2 5 3 9 8 7"/>
  </symbol>

