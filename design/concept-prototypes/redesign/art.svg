<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Goldito placeholder illustration set (Expressive). One style for all: flat shapes, 3 px rounded ink outline (#1B4332),
       fills from the brand palette only — cream #FFF9F0 · mint #D8F3DC · leaf #52B788 · green #2D6A4F · sand #F4A261 ·
       saffron #E9C46A · terracotta #E76F51. viewBox 0 0 120 120, artwork kept inside 8–112 so every piece sits the same size.
       Replace with final art later: keep the symbol ids. -->
  <defs>
    <style>.pn-o{stroke:#1B4332;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>

  <!-- Max (Maltese): fluffy white head, droopy ears, saffron bow -->
  <symbol id="art-dog" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="34" ry="6" fill="#1B4332" opacity=".12"/>
    <path class="pn-o" fill="#FFFFFF" d="M28 50c-10 4-14 22-8 36 4 9 13 10 16 4l4-20z"/>
    <path class="pn-o" fill="#FFFFFF" d="M92 50c10 4 14 22 8 36-4 9-13 10-16 4l-4-20z"/>
    <path class="pn-o" fill="#FFFFFF" d="M60 22c-14 0-22 6-26 14-6 2-9 9-6 15-3 8 0 16 5 20 1 14 13 26 27 26s26-12 27-26c5-4 8-12 5-20 3-6 0-13-6-15-4-8-12-14-26-14z"/>
    <circle cx="48" cy="60" r="4.5" fill="#1B4332"/><circle cx="72" cy="60" r="4.5" fill="#1B4332"/>
    <circle cx="49.5" cy="58.5" r="1.4" fill="#fff"/><circle cx="73.5" cy="58.5" r="1.4" fill="#fff"/>
    <path class="pn-o" fill="#1B4332" d="M55 70h10l-5 6z"/>
    <path class="pn-o" fill="none" d="M60 76v4m-7 1c3 4 11 4 14 0"/>
    <path class="pn-o" fill="#E76F51" d="M56 83c1 6 7 6 8 0z"/>
    <circle cx="41" cy="71" r="4" fill="#F4A261" opacity=".55"/><circle cx="79" cy="71" r="4" fill="#F4A261" opacity=".55"/>
    <path class="pn-o" fill="#E9C46A" d="M60 30l-12-7v14zM60 30l12-7v14z"/><circle class="pn-o" cx="60" cy="30" r="4" fill="#E9C46A"/>
  </symbol>

  <!-- Mochi (shorthair cat): sand head, pointed ears, whiskers -->
  <symbol id="art-cat" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="32" ry="6" fill="#1B4332" opacity=".12"/>
    <path class="pn-o" fill="#F4A261" d="M30 30l8 28h-8zM90 30l-8 28h8z"/>
    <path class="pn-o" fill="#F4A261" d="M30 30l18 16h24l18-16 2 34c0 20-14 34-32 34S28 84 28 64z"/>
