  <!-- Heart -->
  <symbol id="art-heart" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="28" ry="6" fill="#1B4332" opacity=".12"/>
    <path class="pn-o" fill="#E76F51" d="M60 94C38 78 22 64 22 46c0-11 9-20 20-20 8 0 14 4 18 10 4-6 10-10 18-10 11 0 20 9 20 20 0 18-16 32-38 48z"/>
    <path fill="#fff" opacity=".55" d="M36 42c2-6 7-8 11-8-4 3-6 6-7 10z"/>
  </symbol>

  <!-- Potty: little leaf patch -->
  <symbol id="art-potty" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="38" ry="6" fill="#1B4332" opacity=".12"/>
    <path class="pn-o" fill="#D8F3DC" d="M18 98c4-14 20-22 42-22s38 8 42 22z"/>
    <path class="pn-o" fill="#52B788" d="M40 80c-6-16-2-30 10-38 2 14 0 26-10 38zM60 76c0-18 6-30 20-36-2 16-8 28-20 36zM74 84c2-10 10-16 20-16-4 8-10 14-20 16z"/>
  </symbol>

  <!-- Paw (used small, only in its own space) -->
  <symbol id="art-paw" viewBox="0 0 120 120">
    <g class="pn-o" fill="#2D6A4F"><ellipse cx="60" cy="74" rx="22" ry="18"/><ellipse cx="34" cy="50" rx="9" ry="11"/><ellipse cx="50" cy="36" rx="9" ry="11"/><ellipse cx="70" cy="36" rx="9" ry="11"/><ellipse cx="86" cy="50" rx="9" ry="11"/></g>
