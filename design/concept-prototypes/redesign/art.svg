    <path class="pn-o" fill="#FFF9F0" d="M44 78c4-8 28-8 32 0-2 10-30 10-32 0z"/>
    <path class="pn-o" fill="none" d="M44 62c3-3 7-3 10 0M66 62c3-3 7-3 10 0"/>
    <path class="pn-o" fill="#E76F51" d="M56 72h8l-4 4z"/>
    <path class="pn-o" fill="none" d="M38 74l-14-2m14 6l-13 4m57-8l14-2m-14 6l13 4"/>
    <path class="pn-o" fill="none" d="M52 46c2 4 2 6 0 8m16-8c-2 4-2 6 0 8"/>
  </symbol>

  <!-- Food bowl with kibble -->
  <symbol id="art-bowl" viewBox="0 0 120 120">
