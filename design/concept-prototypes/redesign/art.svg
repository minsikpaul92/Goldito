  <symbol id="art-home" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="40" ry="6" fill="#1B4332" opacity=".12"/>
    <path class="pn-o" fill="#FFF9F0" d="M26 56l34-28 34 28v42H26z"/>
    <path class="pn-o" fill="#E76F51" d="M16 60l44-38 44 38-6 6-38-32-38 32z"/>
    <path class="pn-o" fill="#2D6A4F" d="M52 98V74h16v24z"/>
    <rect class="pn-o" x="74" y="66" width="12" height="12" rx="2" fill="#D8F3DC"/>
    <path class="pn-o" fill="#F4A261" d="M38 70c-3-4 0-8 4-6 4-2 7 2 4 6l-4 4z"/>
  </symbol>

  <!-- Pill -->
  <symbol id="art-pill" viewBox="0 0 120 120">
    <ellipse cx="60" cy="104" rx="30" ry="6" fill="#1B4332" opacity=".12"/>
    <g transform="rotate(-35 60 60)"><rect class="pn-o" x="26" y="44" width="68" height="32" rx="16" fill="#FFF9F0"/><path class="pn-o" fill="#E76F51" d="M60 44H42a16 16 0 0 0 0 32h18z"/></g>
    <path fill="#fff" opacity=".7" d="M38 66l10-7 3 4-10 7z"/>
